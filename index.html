<style>
:root{
  --bg:#0a0a0a;--s1:#141414;--s2:#1d1d1d;--line:#2a2a2a;--line2:#3a3a3a;
  --txt:#fafafa;--mut:#8f8f8f;--red:#e30613;--red2:#ff2b3b;--redbg:rgba(227,6,19,.12);
  --yel:#ffd400;--r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{background:var(--bg);color:var(--txt);font-family:'Archivo',system-ui,sans-serif;font-size:15px;line-height:1.4}
body{min-height:100vh;padding-bottom:calc(86px + env(safe-area-inset-bottom));
  background:radial-gradient(120% 50% at 50% -12%,rgba(227,6,19,.22) 0%,transparent 60%),var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;font-size:16px;-webkit-appearance:none;appearance:none;color:var(--txt);background:var(--s1);border:1px solid var(--line2);border-radius:12px;padding:12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red);outline-offset:0;border-color:transparent}
input[type=checkbox]{-webkit-appearance:checkbox;appearance:auto;width:20px;height:20px;accent-color:var(--red)}
input[type=date],input[type=time]{min-height:46px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
label{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;margin:16px 0 6px;font-weight:700}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* 🌴 Modo Vice (temporal, por el estreno del GTA 6) */
body.vice{--bg:#120822;--s1:#1c0f33;--s2:#26164a;--line:#35205e;--line2:#4a2d7c;--mut:#a993c9;--red:#ff2e93;--red2:#ff6ab4;--redbg:rgba(255,46,147,.14);
  background:linear-gradient(180deg,#120822 0%,#1a0b33 45%,#3a0f4a 80%,#ff5e7e 130%) fixed}
body.vice header{background:rgba(18,8,34,.82)}
body.vice nav.tabs{background:rgba(18,8,34,.94)}
body.vice .logo{color:#2de2e6;text-shadow:0 0 8px rgba(45,226,230,.75),0 0 22px rgba(45,226,230,.35)}
body.vice .logo b{color:#ff2e93;text-shadow:0 0 8px rgba(255,46,147,.85),0 0 24px rgba(255,46,147,.45)}
body.vice .logo small{color:#ffb86b;text-shadow:none}
body.vice .logo .vc{display:inline-block;margin-left:6px;font-size:16px;vertical-align:4px}
body.vice .btn.pri{background:linear-gradient(90deg,#ff2e93,#ff7a59);border-color:transparent;box-shadow:0 4px 18px rgba(255,46,147,.35)}
body.vice h2,body.vice h3{text-shadow:0 0 12px rgba(255,46,147,.25)}
body.vice::before{content:'';position:fixed;left:0;right:0;bottom:0;height:34vh;pointer-events:none;z-index:-1;opacity:.35;
  background:linear-gradient(transparent 0,transparent 96%,#ff2e93 96%) 0 0/100% 28px,linear-gradient(90deg,transparent 0,transparent 96%,#2de2e6 96%) 0 0/28px 100%;
  -webkit-mask-image:linear-gradient(transparent,#000 70%);mask-image:linear-gradient(transparent,#000 70%);transform:perspective(300px) rotateX(55deg);transform-origin:bottom}
/* 📰 Periódico diario */
.paper{background:#f3eee2;color:#141414;border-radius:6px;margin:-8px -6px 0;padding:14px 14px 18px;font-family:Georgia,'Times New Roman',serif;box-shadow:inset 0 0 60px rgba(120,90,40,.18)}
.paper .mast{text-align:center;padding:6px 4px 8px;border-bottom:3px double #141414;margin-bottom:6px}
.paper .mast .t{font-weight:900;line-height:.95;letter-spacing:-.01em}
.paper .mast .s{font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-top:4px;opacity:.75}
.paper .meta{display:flex;justify-content:space-between;font-size:10px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #141414;padding:3px 0 5px;margin-bottom:10px;gap:6px}
.paper .kick{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--pc,#c00)}
.paper h1{font-family:'Anton','Archivo',sans-serif;font-size:30px;line-height:1.02;margin:2px 0 8px;text-transform:uppercase;color:#111}
.paper .lead{font-size:14px;line-height:1.4;margin-bottom:10px}
.paper .photo{position:relative;margin:4px 0 10px;border:1px solid #141414;background:#ddd}
.paper .photo svg{display:block}
.paper .photo .emo{aspect-ratio:4/3;display:grid;place-items:center;font-size:96px;background:repeating-linear-gradient(45deg,#e4ddcc 0 8px,#d9d1bd 8px 16px)}
.paper .photo .cap{font-size:11px;font-style:italic;padding:5px 7px;background:#f3eee2;border-top:1px solid #141414}
.paper .photo .stamp{position:absolute;top:10px;right:10px;transform:rotate(8deg);border:3px solid var(--pc,#c00);color:var(--pc,#c00);font-family:'Anton',sans-serif;font-size:15px;padding:2px 8px;background:rgba(243,238,226,.85);text-transform:uppercase}
.paper .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:2px solid #141414;padding-top:8px}
.paper .it{border-bottom:1px solid rgba(0,0,0,.25);padding-bottom:7px}
.paper .it b{display:block;font-family:'Archivo',sans-serif;font-weight:900;font-size:13.5px;line-height:1.15;margin:2px 0 3px}
.paper .it p{font-size:12px;line-height:1.35;margin:0}
.paper .cifra{grid-column:1/-1;display:flex;align-items:center;gap:12px;background:#141414;color:#f3eee2;padding:8px 12px;margin-top:2px}
.paper .cifra .n{font-family:'Anton',sans-serif;font-size:40px;line-height:1;color:var(--pc2,#ffd23f)}
.paper .foot{font-size:10px;text-align:center;margin-top:10px;opacity:.65;font-style:italic}
/* 🎙️ Rueda de prensa */
.press{position:relative;margin:4px 0 8px;border:1px solid #141414;overflow:hidden;aspect-ratio:16/10;
  background:#1b2b52;background-image:repeating-linear-gradient(0deg,transparent 0 34px,rgba(255,255,255,.06) 34px 35px),repeating-linear-gradient(90deg,transparent 0 78px,rgba(255,255,255,.06) 78px 79px)}
.press .wall{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:35px;align-items:center;justify-items:center;
  font-family:'Anton',Impact,sans-serif;font-size:12px;letter-spacing:.06em;color:rgba(255,255,255,.5);white-space:nowrap}
.press .wall span:nth-child(odd){color:rgba(255,80,90,.75)}
.press .pface{position:absolute;left:50%;top:12%;width:38%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.5);background:#ddd;display:grid;place-items:center;font-size:64px}
.press .pface img{width:100%;height:100%;object-fit:cover}
.press .tbl{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(#e30613,#9e0410);border-top:3px solid #fff;display:flex;align-items:center;justify-content:center}
.press .tbl b{font-family:'Anton',Impact,sans-serif;color:#fff;font-size:17px;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.25);padding:2px 12px;border-radius:3px}
.press svg.mics{position:absolute;left:50%;bottom:16%;width:62%;transform:translateX(-50%)}
.press .live{position:absolute;top:8px;left:8px;background:#e30613;color:#fff;font:800 10px 'Archivo',sans-serif;letter-spacing:.12em;padding:3px 7px;border-radius:3px}
/* 📢 Tablón */
.board{background:var(--s1);border:1px solid var(--line2);border-radius:var(--r);padding:4px 14px;margin-top:14px}
.board .bi{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.board .bi:last-child{border-bottom:0}
.board .be{font-size:20px;line-height:1.2;width:26px;text-align:center;flex-shrink:0}
.board .bt{flex:1;font-size:14px;line-height:1.35}
.board .bw{font-size:11px;color:var(--mut);white-space:nowrap;margin-top:2px}
.board .bi.neg .bt b{color:var(--mut)}
/* header & nav */
header{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.85);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding-top:env(safe-area-inset-top)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;max-width:720px;margin:0 auto}
.logo{font-family:'Anton';font-size:28px;line-height:1;letter-spacing:.01em}
.logo b{color:var(--red);font-weight:400}
.logo small{display:block;font-family:'Archivo';font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-top:4px}
.me:not(.pl):not(.f){display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line);padding:5px 14px 5px 5px;border-radius:999px;font-weight:700;font-size:14px;max-width:58%}
.av{width:30px;height:30px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-size:17px;flex:none}
.ph{width:1.5em;height:1.5em;border-radius:50%;object-fit:cover;vertical-align:middle;display:inline-block}
.av .ph,.faces .f .ph{width:100%;height:100%;font-size:inherit}
.faces .f{overflow:hidden}.av{position:relative}
.inj{display:none}.awy{display:none}
.av .awy{display:grid;place-items:center;position:absolute;right:-5px;bottom:-5px;width:17px;height:17px;border-radius:50%;background:#e8eef6;font-style:normal;font-size:10px;line-height:1;box-shadow:0 0 0 1.5px #6b8fbf}
.fut .face .awy{display:grid;place-items:center;position:absolute;right:2%;bottom:4%;width:16cqw;height:16cqw;border-radius:50%;background:#e8eef6;font-style:normal;font-size:9cqw;line-height:1;box-shadow:0 0 0 1cqw #6b8fbf,0 2cqw 5cqw rgba(0,0,0,.4)}
.fut.awyd .face img,.fut.awyd .face{filter:grayscale(.4) opacity(.85)}
.fut .awyb{position:absolute;left:50%;top:44.5%;transform:translateX(-50%) rotate(-6deg);background:#3c6aa8;color:#fff;font-family:'Archivo';font-weight:900;font-size:4.4cqw;letter-spacing:.06em;text-transform:uppercase;padding:1.2cqw 3cqw;border-radius:1.5cqw;white-space:nowrap;z-index:4;box-shadow:0 2cqw 6cqw rgba(0,0,0,.45)}
.daypick{display:flex;gap:6px;flex-wrap:wrap}.daypick button{width:42px;height:42px;border-radius:12px;background:var(--s2);border:1px solid var(--line2);color:var(--txt);font-weight:800}
.daypick button.on{background:#3c6aa8;border-color:#3c6aa8;color:#fff}
.av .inj{display:grid;place-items:center;position:absolute;right:-4px;bottom:-4px;width:15px;height:15px;border-radius:50%;background:#fff;color:#e10600;font-style:normal;font-weight:900;font-size:13px;line-height:1;box-shadow:0 0 0 1.5px #e10600}
.fut .face .inj{display:grid;place-items:center;position:absolute;right:2%;bottom:4%;width:16cqw;height:16cqw;border-radius:50%;background:#fff;color:#e10600;font-style:normal;font-weight:900;font-size:13cqw;line-height:1;box-shadow:0 0 0 1cqw #e10600,0 2cqw 5cqw rgba(0,0,0,.4)}
.fut.injd .face img,.fut.injd .face{filter:grayscale(.55)}
.fut .injb{position:absolute;left:50%;top:44.5%;transform:translateX(-50%) rotate(-6deg);background:#e10600;color:#fff;font-family:'Archivo';font-weight:900;font-size:4.6cqw;letter-spacing:.06em;text-transform:uppercase;padding:1.2cqw 3cqw;border-radius:1.5cqw;white-space:nowrap;z-index:4;box-shadow:0 2cqw 6cqw rgba(0,0,0,.45)}
.injpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.injpick button{display:flex;align-items:center;gap:8px;text-align:left;padding:10px;border-radius:12px;background:var(--s2);border:1px solid var(--line2);color:var(--txt);font-size:13px;font-weight:700}
.injpick button.on{border-color:#e10600;background:rgba(225,6,0,.15)}
.photo-edit{display:flex;gap:16px;align-items:center;margin-top:8px}
.photo-edit .big{width:96px;height:96px;border-radius:50%;background:var(--s1);border:2px dashed var(--line2);display:grid;place-items:center;font-size:44px;overflow:hidden;flex:none}
.photo-edit .big img{width:100%;height:100%;object-fit:cover}
.lvpick{display:flex;gap:4px;margin-top:4px}
.lvpick button{font-size:38px;line-height:1;color:#3a3a3a}
.lvpick button.on{color:var(--red2)}
.lvlabel{font-weight:800;margin-top:4px}
.up{color:#4ade80;font-weight:700}.down{color:var(--red2);font-weight:700}
.me:not(.pl):not(.f) span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(10,10,10,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:720px;margin:0 auto}
nav.tabs{touch-action:manipulation}nav.tabs .in{min-height:60px}
nav.tabs button{flex:1;padding:10px 4px 12px;touch-action:manipulation;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--txt)}
nav.tabs button.on svg{stroke:var(--red)}

/* type */
h2{font-family:'Anton';font-weight:400;font-size:26px;letter-spacing:.01em;margin:28px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;text-transform:uppercase}
h2 .sub{font-family:'Archivo';font-size:13px;color:var(--mut);letter-spacing:0;text-transform:none;font-weight:500}
h3{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:22px 0 10px}
.muted{color:var(--mut)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.wrapr{flex-wrap:wrap}
.sp{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:999px;font-weight:800;font-size:14px;background:var(--s2);border:1px solid var(--line2);white-space:nowrap;letter-spacing:.01em}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:active{background:#b80510}
.btn.wht{background:#fff;color:#0a0a0a;border-color:#fff}
.btn.ghost{background:transparent}
.btn.dan{background:transparent;border-color:#5a1a1d;color:#ff8a92}
.btn.sm{padding:8px 13px;font-size:13px}
.btn.full{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line2);font-size:17px;flex:none}

/* blocks */
.box{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.empty{text-align:center;padding:34px 16px;color:var(--mut);border:1px dashed var(--line2);border-radius:var(--r)}
.empty .big{font-size:38px;margin-bottom:8px}
.banner{display:flex;gap:12px;align-items:center;margin:14px 0 0;padding:14px;border-radius:var(--r);background:var(--redbg);border:1px solid rgba(227,6,19,.4);font-size:14px}
.banner.wht{background:#fff;color:#0a0a0a;border-color:#fff}
.banner .e{font-size:24px}
.promo{flex-shrink:0;position:relative;margin:-8px -4px 0;border-radius:22px;overflow:hidden;background:#0a0a0a;border:1px solid var(--line2)}
.promo .pimg{display:block;width:100%;max-height:52vh;object-fit:cover}
.promo .pph{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:radial-gradient(circle at 50% 35%,#3a0205 0,#0a0a0a 70%);text-align:center;padding:20px}
.promo .pph .bigE{font-size:64px;line-height:1}
.promo .pph .kick{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:#ff5a64;font-weight:800}
.promo .pph.logo{background:radial-gradient(circle at 50% 40%,#1a5fa8 0,#0a3a6e 45%,#05203f 100%);padding:34px 20px 26px}
.promo .pph.logo img{width:min(72%,260px);aspect-ratio:1;border-radius:50%;box-shadow:0 12px 40px rgba(0,0,0,.45),0 0 0 3px rgba(212,175,55,.55)}
.promo .pph .ttl{font-family:Georgia,'Times New Roman',serif;font-size:30px;line-height:1.05;color:#fff}
.promo .body{padding:16px 18px 18px}
.promo .when{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.promo .cd{background:var(--red);color:#fff;border-radius:12px;padding:6px 10px;text-align:center;line-height:1}
.promo .cd b{display:block;font-size:22px}.promo .cd span{font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:800}
.promo .tag{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;letter-spacing:.15em;font-weight:800;padding:5px 9px;border-radius:99px;text-transform:uppercase}
.banner.upd{background:#fff6bf;color:#2a2200;border-color:#f3dc5c}.banner.upd .small{color:#5a4d00}.banner.upd .x{background:rgba(0,0,0,.08);color:#2a2200}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--s2);color:var(--mut)}
.pill.red{background:var(--red);color:#fff}
.pill.wht{background:#fff;color:#0a0a0a}
.pill.out{background:transparent;border:1px solid var(--line2)}

/* match list card */
.mc{display:block;width:100%;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.mc.next{border-color:rgba(227,6,19,.55);background:linear-gradient(160deg,rgba(227,6,19,.16),var(--s1) 55%)}
.mc .top{display:flex;gap:14px;align-items:center}
.date{flex:none;width:56px;text-align:center;border-radius:14px;padding:7px 0;background:#fff;color:#0a0a0a}
.date .m{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.date .d{font-family:'Anton';font-size:28px;line-height:1}
.date .w{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#555}
.mc .t1{font-weight:800;font-size:18px;line-height:1.15}
.mc .t2{color:var(--mut);font-size:13px;margin-top:3px}
.faces{display:flex;align-items:center;margin-top:14px}
.faces .f{width:30px;height:30px;border-radius:50%;background:var(--s2);border:2px solid var(--s1);display:grid;place-items:center;font-size:15px;margin-left:-8px}
.faces .f:first-child{margin-left:0}
.faces .f.me{border-color:var(--red)}
.faces .more{font-size:12px;font-weight:700;color:var(--mut);margin-left:8px}
.count{margin-left:auto;font-family:'Anton';font-size:22px;line-height:1}
.count small{font-family:'Archivo';font-size:13px;color:var(--mut);font-weight:600}
.bar{height:6px;background:var(--s2);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--red);border-radius:99px}
.bar i.full{background:#fff}
.mc .cta{margin-top:14px;display:flex;gap:8px}
.mc .cta .btn{flex:1}
.scoreline{display:flex;align-items:center;gap:10px;margin-top:14px}
.tw,.tb{flex:1;display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.tb{justify-content:flex-end}
.sq{width:14px;height:14px;border-radius:4px;flex:none}
.sq.w{background:#fff}.sq.b{background:#000;border:1.5px solid #fff}
.scoreline .n{font-family:'Anton';font-size:34px;line-height:1;min-width:30px;text-align:center}
.scoreline .dash{color:var(--mut);font-family:'Anton';font-size:20px}

/* detail */
.dhead{display:flex;gap:14px;align-items:center;margin:4px 0 14px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.fact{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.fact b{display:block;font-family:'Anton';font-size:20px;font-weight:400}
.fact span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.plist{counter-reset:p}
.pl{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.pl .num{width:22px;font-family:'Barlow Condensed';font-weight:700;color:var(--mut);font-size:16px;text-align:right}
.pl .nm{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .lv{font-family:'Barlow Condensed';font-weight:700;color:var(--mut)}
.pl.me .nm{color:var(--red2)}
.pl.me{background:linear-gradient(90deg,var(--redbg),transparent 70%);border-radius:12px}
.pl.res{opacity:.55}
.pl.empty-slot .nm{color:#444;font-weight:500}
.teams{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.team{border-radius:16px;padding:12px;min-width:0}
.team.w{background:#fff;color:#0a0a0a}
.team.b{background:#000;border:1.5px solid #fff}
.team .h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.team .h b{font-family:'Anton';font-weight:400;font-size:20px;text-transform:uppercase}
.team .h span{font-family:'Barlow Condensed';font-weight:700;font-size:14px;opacity:.6}
.team .p{display:flex;align-items:center;gap:6px;padding:5px 0;font-size:14px;font-weight:600;width:100%;text-align:left;color:inherit}
.team .p .o{margin-left:auto;font-family:'Barlow Condensed';font-weight:700;opacity:.55}
.team .p .g{font-size:12px;white-space:nowrap;display:inline-flex;align-items:center}.team .p .g i{font-style:normal;font-family:'Barlow Condensed';font-weight:800;font-size:13px;margin-left:1px}
.team .p .fc{flex:0 0 auto;display:inline-flex}.team .p .pm{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:2px}.team .p .pn{overflow:hidden;text-overflow:ellipsis;line-height:1.15;overflow-wrap:anywhere}
.team .p .ic{display:flex;align-items:center;gap:4px;font-size:12px}.team .p .ic .vst{margin-left:0}.team .p .o{flex:0 0 auto;padding-left:4px}
.awards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.aw{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.aw .ae{font-size:20px}
.aw .an{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-top:2px}
.aw b{display:block;font-size:14px;margin-top:2px}
.aw.neg{border-color:#3a3a3a;background:repeating-linear-gradient(135deg,var(--s1) 0 8px,#181818 8px 16px)}

/* FUT cards */
/* ===== Cartas estilo FIFA (todo en cqw: se escala con el ancho de la carta) ===== */
.fut{position:relative;display:block;width:100%;aspect-ratio:5/7.3;container-type:inline-size;text-align:center;padding:0;
  --clip:polygon(50% 0,92% 3%,100% 8.5%,100% 87%,50% 100%,0 87%,0 8.5%,8% 3%);clip-path:var(--clip)}
.fut .fi{position:absolute;inset:1.8cqw;clip-path:var(--clip);overflow:hidden}
.fut .fi::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(60deg,rgba(255,255,255,.07) 0 1.2cqw,transparent 1.2cqw 5cqw);pointer-events:none}
.fut .fi::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.32) 46%,transparent 58%);pointer-events:none}
.fut.gold{background:linear-gradient(160deg,#6e4f10,#f8e49a 28%,#8a6514 52%,#f2d77f 78%,#6e4f10)}
.fut.gold .fi{background:radial-gradient(110% 60% at 28% 8%,#fff8d6 0%,transparent 55%),linear-gradient(172deg,#f7e08f 0%,#e6c35f 34%,#cc9e36 68%,#a77a1e 100%);color:#2e2105}
.fut.silver{background:linear-gradient(160deg,#59616a,#f5f7f9 28%,#7c858e 52%,#e6eaee 78%,#59616a)}
.fut.silver .fi{background:radial-gradient(110% 60% at 28% 8%,#ffffff 0%,transparent 55%),linear-gradient(172deg,#f4f6f8 0%,#d5dade 34%,#adb5bd 68%,#8c949c 100%);color:#1c2125}
.fut.bronze{background:linear-gradient(160deg,#55290c,#f4c59c 28%,#7d4320 52%,#e9b183 78%,#55290c)}
.fut.bronze .fi{background:radial-gradient(110% 60% at 28% 8%,#ffe3c8 0%,transparent 55%),linear-gradient(172deg,#f1c49c 0%,#d69767 34%,#b06d3e 68%,#8b4f27 100%);color:#2a1205}
.fut.inform{background:linear-gradient(160deg,#6e4f10,#f8e49a 28%,#8a6514 52%,#f2d77f 78%,#6e4f10)}
.fut.inform .fi{background:radial-gradient(110% 60% at 30% 10%,#3a3a3a 0%,transparent 60%),linear-gradient(172deg,#1d1d1d 0%,#0b0b0b 60%,#000 100%);color:#f1d27a}
.fut.inform .fi::after{background:linear-gradient(115deg,transparent 25%,rgba(241,210,122,.35) 45%,transparent 60%);background-size:250% 100%;animation:shine 2.6s linear infinite}
.fut.vaya{background:linear-gradient(160deg,#2c2c2c,#9a9a9a 30%,#3a3a3a 55%,#8a8a8a 80%,#2c2c2c)}
.fut.vaya .fi{background:repeating-linear-gradient(135deg,#676767 0 4cqw,#575757 4cqw 8cqw);color:#fff}
.fut .fl{position:absolute;top:12.5%;left:7%;width:25cqw;display:flex;flex-direction:column;align-items:center;z-index:2}
.fut .ovr{font-family:'Anton';font-size:22cqw;line-height:.9}
.fut .pos{font-family:'Barlow Condensed';font-weight:700;font-size:9.5cqw;letter-spacing:.04em;line-height:1;margin-top:1cqw}
.fut .fl i{display:block;width:13cqw;height:.6cqw;background:currentColor;opacity:.35;margin:2.2cqw 0}
.fut .lvl{font-family:'Barlow Condensed';font-weight:700;font-size:8cqw;line-height:1}
.fut .strk{font-family:'Barlow Condensed';font-weight:700;font-size:7cqw;margin-top:2cqw;background:rgba(0,0,0,.18);border-radius:99px;padding:.4cqw 2.4cqw;line-height:1.3}
.fut .face{position:absolute;top:11%;right:8%;width:50cqw;height:50cqw;display:grid;place-items:center;font-size:36cqw;line-height:1;z-index:1}
.fut .face .ph{width:100%;height:100%;object-fit:cover;border-radius:50%;box-shadow:0 0 0 1.4cqw rgba(255,255,255,.75),0 0 0 2.4cqw rgba(0,0,0,.25),0 3cqw 7cqw rgba(0,0,0,.35)}
.fut .nm{position:absolute;left:7%;right:7%;top:54%;font-family:'Anton';font-size:11.5cqw;line-height:1.1;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2}
.fut .sep{position:absolute;top:65%;left:18%;right:18%;height:.5cqw;background:currentColor;opacity:.35}
.fut .st{position:absolute;top:67.5%;left:12%;right:12%;display:grid;grid-template-columns:1fr .5cqw 1fr;column-gap:4cqw;font-family:'Barlow Condensed';z-index:2}
.fut .st .col{display:flex;flex-direction:column;gap:.4cqw}
.fut .st .r{display:grid;grid-template-columns:1fr 1fr;column-gap:2cqw;align-items:baseline;line-height:1.05}
.fut .st b{font-weight:700;font-size:8.8cqw;text-align:right}
.fut .st span{font-weight:600;font-size:7.4cqw;text-align:left;opacity:.8}
.fut .st .dv{background:currentColor;opacity:.3}
.fut .badge{position:absolute;top:4.5%;left:50%;transform:translateX(-50%);font-family:'Archivo';font-size:4.4cqw;font-weight:800;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;opacity:.85;z-index:3}
.fut .mp{position:absolute;left:0;right:0;top:69%;font-family:'Barlow Condensed';font-weight:700;font-size:11cqw;z-index:2}
.fut.big{max-width:240px;margin:0 auto}
.pitch .fut{width:104px;flex:none}
.potm .fut{width:120px;flex:none}
.pitch .fut .st,.potm .fut .st,.pitch .fut .strk,.potm .fut .strk,.pitch .fut .sep,.potm .fut .sep{display:none}
.pitch .fut .badge,.potm .fut .badge{font-size:5.5cqw}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
  clip-path:polygon(50% 0,100% 5%,100% 93%,50% 100%,0 93%,0 5%);color:#fff;
  background:linear-gradient(160deg,#ff3b47 0%,var(--red) 40%,#6d0007 100%)}
.cardsY{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.cy,.cr{display:inline-block;width:8px;height:12px;border-radius:2px}
.cy{background:var(--yel)}.cr{background:var(--red)}

/* tables & boards */
table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);text-align:right;padding:8px 6px;border-bottom:1px solid var(--line)}
th:nth-child(1),th:nth-child(2){text-align:left}
td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td:nth-child(1){text-align:left;width:26px;font-family:'Anton';color:var(--mut)}
td:nth-child(2){text-align:left;font-weight:700}
tr.mine td{background:var(--redbg)}
tbody tr:nth-child(1) td:nth-child(1){color:var(--red)}
td.pts{font-family:'Anton';font-size:18px}
.lb{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbc{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.lbc .tt{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.lbc .l{display:flex;gap:6px;align-items:center;padding:3px 0;font-size:14px}
.lbc .l b{margin-left:auto;font-family:'Barlow Condensed';font-size:16px}
.lbc .l:first-of-type{font-weight:800}
.lbc .l:first-of-type b{color:var(--red2)}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 0 4px}
.monthnav .t{font-family:'Anton';font-size:24px;text-transform:uppercase;text-align:center}
.pitch{position:relative;border-radius:18px;padding:12px 4px;overflow:hidden;background:#0d0d0d;border:1.5px solid #fff}

.pitch .ln{position:relative;z-index:1;display:flex;justify-content:center;gap:6px;margin:8px 0}

.pitch.rombo::before{top:31%}
.pitch .area{position:absolute;left:50%;bottom:-2px;width:62%;height:24%;transform:translateX(-50%);border:1.5px solid rgba(255,255,255,.35);border-bottom:0;border-radius:90px 90px 0 0}

.potm{display:flex;gap:16px;align-items:center}
.hero{display:flex;gap:14px;align-items:center;margin-top:14px;padding:14px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line);width:100%;text-align:left}
.hero .big{font-family:'Anton';font-size:40px;line-height:1;color:var(--red2)}
.hero .t{font-size:12px;color:var(--mut)}
.stars{color:var(--red2);letter-spacing:1px}
.beta{display:inline-block;vertical-align:top;margin:4px 0 0 6px;font-family:'Archivo';font-size:9px;font-weight:800;letter-spacing:.12em;background:var(--red);color:#fff;padding:2px 6px;border-radius:6px}
#sv:disabled,#ok:disabled{opacity:.85;color:transparent!important;position:relative}

.popt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;margin-top:8px;border-radius:14px;background:var(--s2);border:1px solid var(--line2)}

.pchk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-weight:800;flex:none;font-size:13px}

.pbar{display:block;height:4px;border-radius:9px;background:#2a2a2a;margin-top:7px;overflow:hidden}

.popt .pn{font-family:'Anton';font-size:24px;min-width:24px;text-align:right}
.wr{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));animation:fi .2s;user-select:none;-webkit-user-select:none}
.wr.red{background:radial-gradient(120% 80% at 50% 0%,#ff2b3b,#a30010 55%,#3a0005);color:#fff}

.wk{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.wbig{font-family:'Anton';font-size:120px;line-height:.95;text-transform:uppercase}
.wsub{font-size:20px;font-weight:700}

.wrow{display:flex;gap:18px;font-family:'Anton';font-size:32px;margin-top:10px}

.wach{display:flex;flex-wrap:wrap;gap:6px;font-size:30px;margin-top:12px}

.wsum b{display:block;font-family:'Anton';font-size:30px}.wsum small{font-size:10px;font-weight:800;text-transform:uppercase;opacity:.6}
.kitbox{background:linear-gradient(160deg,#1a0002,#0f0f0f 60%);border:1px solid rgba(227,6,19,.35);border-radius:20px;padding:16px}

.kitpromo{display:flex;gap:12px;align-items:center;margin-top:14px;padding:14px;border-radius:var(--r);background:linear-gradient(135deg,#1a0002,#0f0f0f);border:1px solid rgba(227,6,19,.4)}
.kitpromo .ks{display:flex;gap:2px}
.banner .e svg{display:block}

.kitt.on{opacity:1;filter:none;border-color:#fff;background:#fff}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.headline{margin-top:10px;font-weight:800;font-size:14px;line-height:1.3}
.chron{margin-top:14px;padding:16px;border-radius:16px;background:#fff;color:#0a0a0a}
.chron .ck{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}

.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* 🏅 Ventana de logro desbloqueado */
.unl{text-align:center;padding:6px 0 4px}

  background:radial-gradient(circle at 35% 30%,#fff6c9 0,#f5c542 35%,#b8860b 100%);box-shadow:0 0 0 5px rgba(245,197,66,.25),0 12px 40px rgba(245,197,66,.45);animation:unlPop .7s cubic-bezier(.2,1.6,.4,1) both}

  background:repeating-conic-gradient(rgba(245,197,66,.16) 0 10deg,transparent 10deg 20deg);animation:unlSpin 12s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 30%,transparent 70%);mask-image:radial-gradient(circle,#000 30%,transparent 70%)}

@keyframes unlPop{0%{transform:scale(.2) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes unlSpin{to{transform:rotate(360deg)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:cf 2.4s ease-in forwards}
@keyframes cf{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}.ach .an{font-size:12px;font-weight:800;margin-top:2px}.ach .ad{font-size:10px;color:var(--mut);margin-top:2px;line-height:1.2}

.gw-t{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.7}

.prize .pw{font-weight:800;margin-top:6px;font-size:15px}.prize .pv{font-family:'Barlow Condensed';font-weight:700;color:var(--red2);margin-top:2px}

@keyframes vqb{0%,100%{transform:none}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.vqbad{animation:vqb .45s;color:#ff6b6b!important;border-radius:10px;box-shadow:0 0 0 2px rgba(225,6,0,.6)}
.vst{display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;margin-left:5px;vertical-align:middle}
.vst.ok{width:16px;height:16px;border-radius:50%;background:#22c55e;color:#fff;font-size:10px}
.team .p.novote{opacity:.62}
.ov.swap,.ov.swap .md{animation:none!important}
.team .p .o.rt{color:#f5c542;font-weight:800}.team.w .p .o.rt{color:#b8860b}
.mrate{display:flex;gap:8px;margin-top:10px;overflow-x:auto}.mrate>div{flex:1;min-width:76px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:9px 8px;text-align:center}
.mrate b{display:block;font-family:Anton;font-size:20px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mrate span{font-size:10.5px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnames{display:block;font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.3}
.whol{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.whol .vm{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 3px;border-radius:999px;background:rgba(255,255,255,.07);font-size:13px;cursor:pointer}
.whol .vm .av,.whol .vm>span:first-child{width:22px;height:22px}
.heroes{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.htile{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;cursor:pointer}
.htile .he{font-size:22px}.htile .hf{display:flex;justify-content:center;margin:6px 0}.htile .hf>*{width:44px;height:44px;font-size:26px}
.htile .hn{font-family:Anton;font-size:16px;text-transform:uppercase;line-height:1.1}.htile .ht{font-size:11px;font-weight:800;color:var(--yel);margin-top:3px}.htile .hl{font-size:11px;color:var(--mut);margin-top:4px;line-height:1.3}

window.__showFatal=show})();

function promoLive(pr=promoCfg()){if(!pr||!pr.on||!pr.date)return false;const ev=new Date(pr.date+'T23:59:59');const from=new Date(pr.date+'T00:00:00');from.setDate(from.getDate()-(+pr.days||30));const n=new Date(Date.now());return n>=from&&n<=ev}

async function mergeIds(oldId,newId,onlyMid){
  const rmap=a=>{if(!Array.isArray(a))return a;const o=a.map(x=>x===oldId?newId:x);return newId?[...new Set(o)].filter(Boolean):o.filter(x=>x&&x!==oldId)};
  const kmap=o=>{if(!o||typeof o!=='object'||!(oldId in o))return o;const r={...o};const v=r[oldId];delete r[oldId];if(newId&&r[newId]==null)r[newId]=v;return r};
  const ms=Object.values(S.matches).filter(m=>(!onlyMid||m.id===onlyMid));let n=0;
  for(const m of ms){const up={};
    for(const f of ['teamA','teamB','noShow'])if((m[f]||[]).includes(oldId))up[f]=rmap(m[f]);
    for(const f of ['goals','assists','paid','kit'])if(m[f]&&oldId in m[f])up[f]=kmap(m[f]);
    if(m.keepers){const k={...m.keepers};let ch=false;for(const t of ['A','B'])if(k[t]?.pid===oldId){k[t]={...k[t],pid:newId||null};if(!newId)k[t].mode='none';ch=true}if(ch)up.keepers=k}

    for(const [vid,v] of Object.entries(S.votes)){if(v.mid!==m.id)continue;const up2={};
      if(v.ratings&&oldId in v.ratings)up2.ratings=kmap(v.ratings);if(v.gk&&oldId in v.gk)up2.gk=kmap(v.gk);
      if(v.awards&&Object.values(v.awards).includes(oldId)){const a={...v.awards};for(const k in a)if(a[k]===oldId){if(newId)a[k]=newId;else delete a[k]}up2.awards=a}

async function hashPin(pin){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('fifa07:'+pin));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

const mdt=m=>new Date(`${m.date}T${m.time||'20:00'}:00`);
const hoursTo=m=>(mdt(m)-Date.now())/36e5;
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIA=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

/* ============ DERIVADOS ============ */
function signupsOf(mid){return Object.values(S.signups).filter(s=>s.mid===mid).sort((a,b)=>(a.at||0)-(b.at||0))}
// Orden de la lista: ⭐ quien se quedó de reserva en el partido anterior entra primero; 🐢 quien no votó a tiempo va al final
// (solo en su siguiente partido). Dentro de cada grupo, por orden de inscripción.
function prevPlayed(m){return memo('pv_'+m.id,()=>{const t=+mdt(m);let best=null;for(const x of Object.values(S.matches))if(x.status==='played'&&x.id!==m.id&&+mdt(x)<t&&(!best||+mdt(x)>+mdt(best)))best=x;return best})}
// ⭐ La prioridad solo vale si te apuntas pronto: en las primeras PRIO_HOURS h desde que se abre el partido
// Después cuentas como uno más: así no echas a quien lleva días apuntado.
let PRIO_HOURS=24;
function mOpenAt(m){if(+m.createdAt>1e12)return +m.createdAt;const ss=signupsOf(m.id);return ss.length?Math.min(...ss.map(s=>+s.at||Infinity)):Date.now()}
const prioUntil=m=>mOpenAt(m)+PRIO_HOURS*36e5;
function qRank(pid,m){if(m.status==='played')return 1;
  const tl=P(pid)?.tail;if(tl&&+tl.at<+mdt(m)){const used=Object.values(S.matches).some(x=>x.status==='played'&&+mdt(x)>+tl.at&&+mdt(x)<+mdt(m)&&S.signups[`${x.id}__${pid}`]);if(!used)return 2}
  const pv=prevPlayed(m);if(pv&&S.signups[`${pv.id}__${pid}`]&&![...(pv.teamA||[]),...(pv.teamB||[])].includes(pid)){const su=S.signups[`${m.id}__${pid}`];if(+(su?.at??Date.now())<=prioUntil(m))return 0}

async function makeTeams(mid,shuffle){
  const m=S.matches[mid];const st=computeStats();const lv=p=>st[p]?.level||2;
  const T=balance(lineup(m).in,st);
  if(shuffle){
    const opts=[];for(const a of T.A)for(const b of T.B){if(isGK(a)||isGK(b))continue;const nd=Math.abs((T.sa-T.sb)-2*(lv(a)-lv(b)));if(nd<=Math.abs(T.sa-T.sb)+0.5)opts.push([a,b])}
    if(opts.length){const[a,b]=opts[Math.floor(Math.random()*opts.length)];T.A=T.A.map(x=>x===a?b:x);T.B=T.B.map(x=>x===b?a:x);T.sa+=lv(b)-lv(a);T.sb+=lv(a)-lv(b)}
  }
  try{await store.doc('matches/'+mid).update({teamA:T.A,teamB:T.B});toast(`Reparto hecho ⚖️ ⚡${(T.sa/(T.A.length||1)).toFixed(2)} vs ${(T.sb/(T.B.length||1)).toFixed(2)}`)}catch(e){err(e)}
}
// Reparto automático: con la lista completa queda fijado; si se libera una plaza, vuelve a ser provisional.
async function autoTeams(mid){
  await new Promise(r=>setTimeout(r,80));
  const m=S.matches[mid];if(!m||m.status==='played')return;
  const L=lineup(m),n=m.slots||10,saved=(m.teamA||[]).length>0;
  try{
    if(isManual(m)){ // a mano: solo se quita a quien ya no está en la lista; los nuevos quedan "sin equipo"
      const A=(m.teamA||[]).filter(p=>L.in.includes(p)),B=(m.teamB||[]).filter(p=>L.in.includes(p));
      if(A.length!==(m.teamA||[]).length||B.length!==(m.teamB||[]).length)await store.doc('matches/'+mid).update({teamA:A,teamB:B});
      return;
    }
    if(L.in.length>=n){
      const T=balance(L.in,computeStats());
      const same=saved&&[...m.teamA].sort().join()===[...T.A].sort().join()&&[...m.teamB].sort().join()===[...T.B].sort().join();
      if(!same)await store.doc('matches/'+mid).update({teamA:T.A,teamB:T.B});
    }else if(saved)await store.doc('matches/'+mid).update({teamA:[],teamB:[]});
  }catch(e){console.error(e)}
}

    md.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const p=b.dataset.g;goals[p]=Math.max(0,(goals[p]||0)+ +b.dataset.d);draw(md)});
    md.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const p=b.dataset.a;ast[p]=Math.max(0,(ast[p]||0)+ +b.dataset.d);draw(md)});
    md.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{const p=b.dataset.tg;team[p]=team[p]==='A'?'B':'A';sync();draw(md)});
    md.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const p=b.dataset.k;kit[p]=!kit[p];draw(md)});
  };
  const sIn=v=>`style="width:72px;text-align:center;font-family:Anton;font-size:30px;padding:8px" type="number" min="0" inputmode="numeric" value="${v}"`;
  modal(`${mh('Resultado')}
    <div class="box"><div class="scoreline" style="margin:0"><div class="tw"><i class="sq w"></i>Blancos</div><input id="sa" ${sIn(+m.scoreA||0)}><div class="dash">–</div><input id="sb" ${sIn(+m.scoreB||0)}><div class="tb">Negros<i class="sq b"></i></div></div></div>
    <p class="small" style="margin:12px 0 0;line-height:1.45">✍️ Tú solo tienes que poner el <b>resultado</b>. Los goles${astOn()?' y asistencias':''} los apunta <b>cada jugador</b> al votar; aquí abajo puedes <b>corregirlos</b> si algo no cuadra.</p>
    <h3>🚫 ¿Faltó alguien sin avisar?</h3><p class="small muted" style="margin-top:-4px">Se le quita del partido y se lleva 🟥 directa.</p><div class="opts" id="ns"></div>
    <details class="fix"><summary>✏️ Corregir equipos o goles${astOn()?' / asistencias':''}</summary>
    <p class="muted small" id="hint" style="margin:8px 0 2px"></p>${kitOn()?`<p class="muted small">👕 = vino con la camiseta oficial (+${PTS.kit} pt)</p>`:''}
    <div id="rows"></div>
    <button class="btn full ghost" id="addp" style="margin-top:12px">＋ Vino alguien que no estaba apuntado</button></details>
    <button class="btn pri full" id="sv" style="margin-top:10px">Guardar resultado</button>`,
  md=>{
    draw(md);
    md.querySelector('#addp').onclick=()=>{
      const used=new Set([...A,...B]);const opts=Object.keys(S.players).filter(p=>!used.has(p)).sort((a,b)=>pname(a).localeCompare(pname(b)));
      if(!opts.length){toast('No quedan jugadores');return}
      const sel=document.createElement('select');sel.innerHTML='<option value="">Elige jugador…</option>'+opts.map(p=>`<option value="${esc(p)}">${esc(pname(p))}</option>`).join('');sel.style.marginTop='8px';
      sel.onchange=()=>{if(!sel.value)return;team[sel.value]=A.length<=B.length?'A':'B';sync();sel.remove();draw(md)};
      md.querySelector('#addp').after(sel);
    };
    md.querySelector('#sv').onclick=async e=>{
      {const sA=Math.max(0,+md.querySelector('#sa').value||0),sB=Math.max(0,+md.querySelector('#sb').value||0);
        const sum=(arr,o)=>arr.reduce((t,p)=>t+(+o[p]||0),0);
        if(sum(A,goals)>sA||sum(B,goals)>sB){toast(`⚽ Hay más goles apuntados que el resultado (${TEAM.A.n} ${sum(A,goals)}/${sA} · ${TEAM.B.n} ${sum(B,goals)}/${sB}). Corrígelo.`);return}
        if(sum(A,ast)>sA||sum(B,ast)>sB){toast('🎯 Hay más asistencias que goles en algún equipo. Corrígelo.');return}}
      e.target.disabled=true;
      // Solo se guardan como corrección los números distintos de lo que declaró cada jugador.
      const g={},a={},k={};[...A,...B].forEach(p=>{const s=myStat(mid,p)||{};if((goals[p]||0)!==(+s.g||0))g[p]=goals[p]||0;if((ast[p]||0)!==(+s.a||0))a[p]=ast[p]||0;if(kit[p])k[p]=true});
      try{
        await store.doc('matches/'+mid).update({teamA:A,teamB:B,scoreA:Math.max(0,+md.querySelector('#sa').value||0),scoreB:Math.max(0,+md.querySelector('#sb').value||0),goals:g,assists:a,kit:k,noShow:[...ns],status:'played',playedAt:m.playedAt||Date.now()});
        // Tarjeta roja por no presentarse (y se quita si se desmarca).
        for(const p of ns)if(!prevNS.has(p)&&P(p)){const pl=P(p);await store.doc('players/'+p).update({red:(pl.red||0)+1,cardLog:[...(pl.cardLog||[]),{type:'red',mid,reason:'noshow',at:Date.now()}]})}
        for(const p of prevNS)if(!ns.has(p)&&P(p)){const pl=P(p);const log=(pl.cardLog||[]).filter(c=>!(c.mid===mid&&c.reason==='noshow'));if(log.length!==(pl.cardLog||[]).length)await store.doc('players/'+p).update({red:Math.max(0,(pl.red||0)-1),cardLog:log})}
        close();toast('Resultado guardado. Cada uno apunta sus goles al votar ⭐');
        if(me&&[...A,...B].includes(me)&&!hasVoted(mid,me))setTimeout(()=>voteForm(mid),450);
      }catch(x){e.target.disabled=false;err(x)}
    };
  });
}

  if(goalsLocked(m)){toast(`🔒 Los goles solo se pueden apuntar hasta ${GOALS_EDIT_HOURS} h después del partido. Si hay un error, díselo a ${orgName(m)}.`);return}
  const ms=myStat(mid,me)||{};let g=+ms.g||0,a=+ms.a||0;
  modal(`${mh('Mis goles')}<p class="muted small">${esc(fmtShort(m))} · Blancos ${+m.scoreA||0} – ${+m.scoreB||0} Negros</p>
    <div class="box row" style="justify-content:space-around;margin-top:14px"><div style="text-align:center"><div style="font-size:11px;color:var(--mut);font-weight:800">GOLES</div><div class="stepper" style="margin-top:6px"><button data-g="-1">−</button><span id="g">${g}</span><button data-g="1">+</button></div></div>
    ${astOn()?`<div style="text-align:center"><div style="font-size:11px;color:var(--mut);font-weight:800">ASISTENCIAS</div><div class="stepper" style="margin-top:6px"><button data-a="-1">−</button><span id="a">${a}</span><button data-a="1">+</button></div></div>`:''}</div>

    md.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const d=+b.dataset.a;if(d>0&&a>=aR){toast('🎯 '+capMsg(m,me,'a'));return}a=Math.max(0,a+d);md.querySelector('#a').textContent=a});
    md.querySelector('#sv').onclick=async e=>{if(g>gR){toast('⚽ '+capMsg(m,me,'g'));return}if(a>aR){toast('🎯 '+capMsg(m,me,'a'));return}e.target.disabled=true;try{await store.doc(`stats/${mid}__${me}`).set({mid,pid:me,g,a,at:Date.now()});close();toast('Apuntado ⚽')}catch(x){e.target.disabled=false;err(x)}};
  });
}
function voteForm(mid){
  const m=S.matches[mid];if(!me){pickMe();return}
  if(m&&voteClosed(m)&&!hasVoted(mid,me)){toast(`🔒 La votación se cerró ${VOTE_HOURS} h después del partido`);return}
  if(hasVoted(mid,me)){toast('Ya has votado este partido ✅');return}
  if(!attendees(m).includes(me)){toast('Solo votan los que jugaron');return}
  const others=attendees(m).filter(p=>p!==me&&P(p));
  const KPm=keepersOf(m);const gkO=['A','B'].map(k=>KPm[k]).filter(k=>k.mode==='fixed'&&k.pid!==me&&P(k.pid)).map(k=>k.pid);const gr={};let muro=null;
  const r={},aw={};const ms=myStat(mid,me)||{};let myG=+ms.g||0,myA=+ms.a||0;let fs=0;const ftags=new Set();
  const SL={1:'Tronco',2:'Flojito',3:'Cumplió',4:'Muy bien',5:'Crack'};
  modal(`${mh('Puntúa el partido')}<p class="muted small">${esc(fmtShort(m))} · ${esc(m.venue||'')}<br>🔒 <b>Voto anónimo:</b> nadie, ni los admins, puede ver qué has votado. Solo se puede votar una vez.</p>
    ${goalsLocked(m)?`<p class="small muted" style="margin-top:14px">🔒 Ya han pasado ${GOALS_EDIT_HOURS} h: tus goles no se pueden cambiar.</p><div style="display:none">`:'<div>'}
    <h3>⚽ Tus números <span style="text-transform:none;letter-spacing:0;font-weight:500">· sé honesto, se nota 😏</span></h3>
    <div class="box row" style="justify-content:space-around"><div style="text-align:center"><div class="lbl" style="font-size:11px;color:var(--mut);font-weight:800">GOLES</div><div class="stepper" style="margin-top:6px"><button data-mg="-1">−</button><span id="mg">${myG}</span><button data-mg="1">+</button></div></div>
      ${astOn()?`<div style="text-align:center"><div class="lbl" style="font-size:11px;color:var(--mut);font-weight:800">ASISTENCIAS</div><div class="stepper" style="margin-top:6px"><button data-ma="-1">−</button><span id="ma">${myA}</span><button data-ma="1">+</button></div></div>`:''}</div>
    </div>
    <h3 id="vqField">🏟️ ¿Qué tal el campo? <span style="text-transform:none;letter-spacing:0;font-weight:500">· ${esc(m.venue||'')}</span></h3>
    <div class="row"><div class="starpick" id="fst">${[1,2,3,4,5].map(i=>`<button data-fs="${i}">★</button>`).join('')}</div></div>
    <div class="opts" id="ftg" style="margin-top:8px">${FIELD_TAGS.map(t=>`<button class="opt" data-ft="${esc(t)}">${esc(t)}</button>`).join('')}</div>
    <h3>Nivel de hoy</h3>
    ${others.map(p=>`<div class="prow"><span class="av">${face(p)}</span><span class="nm">${esc(pname(p))}</span><div class="starpick" data-p="${esc(p)}">${[1,2,3,4,5].map(i=>`<button data-s="${i}">★</button>`).join('')}</div><span class="sl"></span></div>`).join('')}
    ${gkO.length?`<h3>🧤 ¿Qué tal en portería?</h3>
      ${gkO.map(p=>`<div class="prow"><span class="av">${face(p)}</span><span class="nm">${esc(pname(p))}</span><div class="starpick" data-g="${esc(p)}">${[1,2,3,4,5].map(i=>`<button data-s="${i}">★</button>`).join('')}</div><span class="sl"></span></div>`).join('')}
      <h3 id="vqMuro">${GK_AWARD.e} ${GK_AWARD.n} <span style="text-transform:none;letter-spacing:0;font-weight:500">· ${GK_AWARD.d}</span></h3><div class="opts" data-awg="1">${gkO.map(p=>`<button class="opt" data-v="${esc(p)}">${esc(pname(p))}</button>`).join('')}</div>`:''}
    ${AWARDS.map(A=>`<h3 id="vqAw_${A.k}">${A.e} ${A.n} <span style="text-transform:none;letter-spacing:0;font-weight:500">· ${A.d}</span></h3><div class="opts" data-aw="${A.k}">${(A.self?[me,...others]:others).map(p=>`<button class="opt" data-v="${esc(p)}">${p===me?'Yo mismo 🙋':esc(pname(p))}</button>`).join('')}</div>`).join('')}
    <p class="small muted" style="margin-top:18px">Hay que rellenarlo todo (las etiquetas del campo son opcionales).</p><button class="btn pri full" id="sv" style="margin-top:10px">Enviar votos</button>`,
  md=>{
    md.querySelectorAll('[data-fs]').forEach(b=>b.onclick=()=>{fs=+b.dataset.fs;md.querySelectorAll('[data-fs]').forEach(x=>x.classList.toggle('on',+x.dataset.fs<=fs))});
    md.querySelectorAll('[data-ft]').forEach(b=>b.onclick=()=>{const t=b.dataset.ft;ftags.has(t)?ftags.delete(t):ftags.add(t);b.classList.toggle('on',ftags.has(t))});
    const gR=statRoom(m,me,'g'),aR=statRoom(m,me,'a');
    md.querySelectorAll('[data-mg]').forEach(b=>b.onclick=()=>{const d=+b.dataset.mg;if(d>0&&myG>=gR){toast('⚽ '+capMsg(m,me,'g'));return}myG=Math.max(0,myG+d);md.querySelector('#mg').textContent=myG});
    md.querySelectorAll('[data-ma]').forEach(b=>b.onclick=()=>{const d=+b.dataset.ma;if(d>0&&myA>=aR){toast('🎯 '+capMsg(m,me,'a'));return}myA=Math.max(0,myA+d);md.querySelector('#ma').textContent=myA});
    md.querySelectorAll('.starpick[data-g]').forEach(sp=>sp.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const p=sp.dataset.g,v=+b.dataset.s;gr[p]=v;sp.querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.s<=v));sp.nextElementSibling.textContent=SL[v]}));
    md.querySelectorAll('[data-awg] .opt').forEach(b=>b.onclick=()=>{muro=muro===b.dataset.v?null:b.dataset.v;md.querySelectorAll('[data-awg] .opt').forEach(x=>x.classList.toggle('on',x.dataset.v===muro))});
    md.querySelectorAll('.starpick[data-p]').forEach(sp=>sp.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const p=sp.dataset.p,v=+b.dataset.s;r[p]=v;sp.querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.s<=v));sp.nextElementSibling.textContent=SL[v]}));
    md.querySelectorAll('[data-aw]').forEach(g=>{const k=g.dataset.aw,neg=AWARDS.find(a=>a.k===k).pts<0;
      g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{aw[k]=aw[k]===b.dataset.v?null:b.dataset.v;g.querySelectorAll('.opt').forEach(x=>{x.classList.remove('on','onw');if(x.dataset.v===aw[k])x.classList.add(neg?'onw':'on')})})});

      // Todo obligatorio: campo, estrellas de todos, porteros (si hay fijos) y todos los premios
      const go=(el,msg)=>{toast(msg);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.remove('vqbad');void el.offsetWidth;el.classList.add('vqbad')}};
      if(!fs)return go(md.querySelector('#vqField'),'⭐ Puntúa el campo');
      const miss=others.filter(p=>!r[p]);
      if(miss.length)return go(md.querySelector(`.starpick[data-p="${CSS.escape(miss[0])}"]`)?.closest('.prow'),`Faltan estrellas para ${miss.map(pname).join(', ')}`);
      const gmiss=gkO.filter(p=>!gr[p]);
      if(gmiss.length)return go(md.querySelector(`.starpick[data-g="${CSS.escape(gmiss[0])}"]`)?.closest('.prow'),`🧤 Puntúa en portería a ${gmiss.map(pname).join(', ')}`);
      if(gkO.length&&!muro)return go(md.querySelector('#vqMuro'),`${GK_AWARD.e} Elige ${GK_AWARD.n}`);
      const am=AWARDS.find(A=>!aw[A.k]);
      if(am)return go(md.querySelector('#vqAw_'+am.k),`${am.e} Elige ${am.n}`);
      if(!goalsLocked(m)){if(myG>gR){toast('⚽ '+capMsg(m,me,'g'));return}if(myA>aR){toast('🎯 '+capMsg(m,me,'a'));return}}
      if(hasVoted(mid,me)){toast('Ya has votado este partido ✅');close();return}
      e.target.disabled=true;
      const awards={};AWARDS.forEach(A=>{if(aw[A.k])awards[A.k]=aw[A.k]});if(muro)awards.muro=muro;
      try{
        // El voto se guarda SIN identificar a quien vota; aparte solo se marca que ya ha votado.
        const vd={mid,ratings:r,awards};if(Object.keys(gr).length)vd.gk=gr;if(fs)vd.field={s:fs,tags:[...ftags],venue:m.venue||''};
        await store.doc('votes/'+Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>b.toString(36).padStart(2,'0')).join('')).set(vd);
        await store.doc(`voted/${mid}__${me}`).set({mid,pid:me});
        if(!goalsLocked(m))await store.doc(`stats/${mid}__${me}`).set({mid,pid:me,g:myG,a:myA,at:Date.now()});
        close();toast('Votos enviados 🗳️');
      }catch(x){e.target.disabled=false;err(x)}
    };
  });
}

}

function shrinkImage(file,size){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{const s=Math.min(img.naturalWidth,img.naturalHeight);const c=document.createElement('canvas');c.width=c.height=size;
      const g=c.getContext('2d');g.drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,size,size);

  });
}

const seasonOf=m=>seasonOfDate(mdt(m));
const seasonLabel=y=>`${String(y).slice(2)}/${String(y+1).slice(2)}`;

function enrich(st){
  const voted={};Object.values(S.voted).forEach(v=>voted[v.pid]=(voted[v.pid]||0)+1);
  const hon=monthHonors();
  for(const id in st){const s=st[id];const H=s.hist;
    let cw=0,cl=0,cg=0,cd=0,maxW=0,maxL=0,maxGS=0,maxDry=0,maxG=0;
    H.forEach(x=>{
      if(x.res==='V'){cw++;maxW=Math.max(maxW,cw)}else cw=0;
      if(x.res==='D'){cl++;maxL=Math.max(maxL,cl)}else cl=0;
      if(x.g>0){cg++;maxGS=Math.max(maxGS,cg);cd=0}else{cd++;maxDry=Math.max(maxDry,cd);cg=0}
      maxG=Math.max(maxG,x.g)});
    const tail=f=>{let n=0;for(let i=H.length-1;i>=0;i--){if(f(H[i]))n++;else break}return n};
    Object.assign(s,{wS:tail(x=>x.res==='V'),lS:tail(x=>x.res==='D'),gS:tail(x=>x.g>0),dry:tail(x=>!x.g),maxW,maxL,maxGS,maxDry,maxG,
      venues:new Set(H.map(x=>normV(x.m.venue))).size,
      nights:H.filter(x=>+(x.m.time||'0').split(':')[0]>=22).length,
      fixed:H.filter(x=>x.m.recurring).length,
      paidN:H.filter(x=>(x.m.paid||{})[id]).length,
      fromRes:H.filter(x=>x.m.promoted?.pid===id).length,
      orgN:H.filter(x=>x.m.createdBy===id).length,
      votedN:voted[id]||0,noShows:(S.players[id]?.cardLog||[]).filter(c=>c.reason==='noshow').length,
      potm:hon.potm[id]||0,pich:hon.pich[id]||0,impN:hon.imp?.[id]||0,talN:hon.tal?.[id]||0,bombN:bomberosIn(null)[id]||0});
    // Extra para logros
    const won=x=>Math.abs((+x.m.scoreA||0)-(+x.m.scoreB||0));
    const firsts=H.filter(x=>{const sg=signupsOf(x.m.id);return sg.length>1&&sg[0].pid===id}).length;
    const lastMin=H.filter(x=>{const sg=S.signups[`${x.m.id}__${id}`];return sg&&+sg.at>1e12&&(+mdt(x.m)-sg.at)<3*36e5&&(+mdt(x.m)-sg.at)>0}).length;
    let maxWeek=0;H.forEach((x,i)=>{const t=+mdt(x.m);let n=0;for(let j=i;j<H.length&&+mdt(H[j].m)-t<7*864e5;j++)n++;maxWeek=Math.max(maxWeek,n)});
    const mates=new Set();H.forEach(x=>{const T=(x.m.teamA||[]).includes(id)?x.m.teamA:x.m.teamB||[];T.forEach(q=>{if(q!==id)mates.add(q)})});
    let cu=0,maxU=0;H.forEach(x=>{if(x.res!=='D'){cu++;maxU=Math.max(maxU,cu)}else cu=0});
    let cnw=0,maxNW=0;H.forEach(x=>{if(x.res!=='V'){cnw++;maxNW=Math.max(maxNW,cnw)}else cnw=0});
    const ds=duelStats(id);
    Object.assign(s,{bigW:H.filter(x=>x.res==='V'&&won(x)>=5).length,bigL:H.filter(x=>x.res==='D'&&won(x)>=5).length,
      hats:H.filter(x=>x.g>=3).length,tops:H.filter(x=>{const gg=goalsOf(x.m);const mx=Math.max(0,...Object.values(gg).map(Number));return x.g>0&&x.g===mx}).length,
      crackLoss:H.filter(x=>x.res==='D'&&x.aws.includes('⭐')).length,vayaWin:H.filter(x=>x.res==='V'&&x.aws.includes('🤦')).length,
      nil:H.filter(x=>!(+x.m.scoreA)&&!(+x.m.scoreB)).length,oneGoal:H.filter(x=>x.res==='V'&&won(x)===1).length,
      months:new Set(H.map(x=>(x.m.date||'').slice(0,7))).size,maxWeek,mates:mates.size,firsts,lastMin,maxU,maxNW,
      thu:H.filter(x=>mdt(x.m).getDay()===4).length,sat:H.filter(x=>mdt(x.m).getDay()===6).length,sun:H.filter(x=>mdt(x.m).getDay()===0).length,
      morning:H.filter(x=>+(x.m.time||'0').split(':')[0]<14).length,goalWin:H.filter(x=>x.res==='V'&&x.g>0).length,
      dW:ds.w,dL:ds.l,dN:ds.n,nutW:ds.nutW,nutL:ds.nutL,rej:ds.rej,maxStar:Math.max(0,...H.map(x=>x.avg||0)),minStar:Math.min(9,...H.filter(x=>x.avg!=null).map(x=>x.avg))});
  }

function duelStats(pid){return memo('ds:'+pid,()=>{const o={w:0,l:0,n:0,nutW:0,nutL:0,rej:0};
  for(const d of Object.values(S.duels)){if(d.from!==pid&&d.to!==pid)continue;if(d.status==='rejected'&&d.to===pid)o.rej++;
    const r=duelResult(d);if(r.state!=='final'&&r.state!=='draw')continue;o.n++;if(r.state!=='final')continue;
    if(r.winner===pid){o.w++;if(d.kind==='nutmeg'&&d.from===pid)o.nutW++}else{o.l++;if(d.kind==='nutmeg'&&d.to===pid&&d.nut==='yes')o.nutL++}}
  return o})}
// 🧱🍀🚒 Los de siempre: premios para los que no ganan el Crack ni el pichichi pero sostienen el grupo.
// 🧱 Imprescindible: el que más juega sin dar guerra (sin tarjetas, votando y pagando). 🍀 Talismán: con quién gana más su equipo (mín. 3 PJ).
// 🚒 Bombero: el que completa la lista en las últimas 48 h para que el partido no se caiga. Los dos primeros excluyen al jugador del mes y al pichichi.
function bomberosIn(flt){return memo('bomb_'+(flt?flt.k:'all'),()=>{const c={};

function hashStr(s){let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
function rng(seed){let x=seed||7;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return((x>>>0)%100000)/100000}}
function chronicle(m){
  const R=rng(hashStr(m.id+(m.scoreA||0)+'-'+(m.scoreB||0)));const pick=a=>a[Math.floor(R()*a.length)];
  const a=+m.scoreA||0,b=+m.scoreB||0,diff=Math.abs(a-b),W=Math.max(a,b),L=Math.min(a,b);
  const win=a>b?'Blancos':b>a?'Negros':null,lose=a>b?'Negros':'Blancos';
  const winT=a>b?m.teamA||[]:m.teamB||[],loseT=a>b?m.teamB||[]:m.teamA||[];
  const venue=m.venue||'el campo';const n=attendees(m).length;
  const sc=Object.entries(goalsOf(m)).filter(([p,g])=>g>0&&P(p)).sort((x,y)=>y[1]-x[1]);
  const top=sc[0];const aw=matchAwards(m);const nm=p=>pname(p);
  const lv=computeLevels();const avg=t=>t.length?t.reduce((s,p)=>s+(lv[p]?.pre[m.id]??lv[p]?.level??2),0)/t.length:0;
  const upset=win&&avg(winT)<avg(loseT)-0.15;
  const nGol={2:'doblete',3:'hat-trick',4:'póker',5:'manita'};
  let title;
  if(top&&top[1]>=3&&R()<.6)title=pick([`${nm(top[0])} hace un ${nGol[Math.min(top[1],5)]} y ${win?`los ${winT.includes(top[0])?win:lose} ${winT.includes(top[0])?'ganan':'pierden igual'}`:'aun así empatan'}`,`Noche de ${nm(top[0])}: ${top[1]} goles en ${venue}`]);
  else if(!win)title=a===0?pick(['0-0: el mal fútbol en estado puro','Ni un gol. Ni uno. Leyendas.']):pick([`Tablas en ${venue}: ${a}-${b} y todos contentos`,`Empate a ${a} y nadie se fue a casa feliz`,`${a}-${b}: reparto de puntos y de vergüenza`]);
  else if(upset)title=pick([`Batacazo: los ${win} tumban a los favoritos (${W}-${L})`,`Sorpresa en ${venue}: los ${win} ganan ${W}-${L} contra pronóstico`]);
  else if(diff>=5)title=pick([`Paliza histórica: los ${win} pasan por encima (${W}-${L})`,`Los ${win} firman un ${W}-${L} que dolerá semanas`]);
  else if(diff>=3)title=pick([`Los ${win} golean a los ${lose} (${W}-${L})`,`Los ${win} no tienen piedad: ${W}-${L}`,`Exhibición de los ${win}: ${W}-${L}`]);
  else if(diff===1)title=pick([`Los ${win} se llevan un partido de infarto (${W}-${L})`,`Por la mínima: ${win} ${W}, ${lose} ${L}`,`Sufriendo pero ganando: los ${win}, ${W}-${L}`]);
  else title=pick([`Los ${win} se imponen ${W}-${L}`,`Victoria clara de los ${win} (${W}-${L})`]);
  const body=[];
  body.push(pick([`${DIA[mdt(m).getDay()][0].toUpperCase()+DIA[mdt(m).getDay()].slice(1)} de pachanga en ${venue}: ${n} valientes y ${a+b} ${a+b===1?'gol':'goles'}.`,`${n} jugadores se citaron en ${venue} para demostrar, otra vez, que el fútbol no es lo suyo.`,`Se jugó en ${venue}, ${n} en el campo y ${a+b} ${a+b===1?'gol':'goles'} en el marcador.`]));
  if(top){
    const g=top[1],p=nm(top[0]);
    if(g>=3)body.push(pick([`${p} se vistió de estrella con ${g} goles. Que no se acostumbre.`,`El ${nGol[Math.min(g,5)]} de ${p} será recordado... al menos hasta el jueves.`]));
    else if(g===2)body.push(pick([`${p} hizo un doblete y ya pide la renovación.`,`Doblete de ${p}, que celebró cada gol como una final.`]));
    else body.push(pick([`Goles repartidos: nadie quiso destacar demasiado.`,`El gol estuvo muy repartido, como la falta de calidad.`]));
    const others=sc.slice(1,4).map(([q,gg])=>`${nm(q)}${gg>1?` (${gg})`:''}`);
    if(others.length)body.push(`También marcaron ${others.join(', ')}.`);
  }else if(a+b===0)body.push(pick(['Los porteros fueron los mejores, o los delanteros los peores. El debate sigue abierto.','90 minutos de fútbol sin goles: un homenaje al nombre del grupo.']));
  if(upset)body.push(pick([`Sobre el papel no tenían nada que hacer, pero el papel no juega.`,`Los números decían otra cosa. Los números no saben de pachangas.`]));
  if(aw.nVotes){
    const j=k=>{const a=aw.win[k].map(nm);return a.length>1?a.slice(0,-1).join(', ')+' y '+a[a.length-1]:a[0]};const pl=(k,s,p)=>aw.win[k].length>1?p:s;
    if(aw.win.crack.length)body.push(pick([`El vestuario eligió a ${j('crack')} como El Crack ⭐.`,`⭐ ${j('crack')}, El Crack de la noche por votación popular.`]));
    if(aw.win.dandy.length)body.push(pick([`🎩 ${j('dandy')} ${pl('dandy','se llevó','se llevaron')} el premio Dandy: más filigranas que acierto.`,`El toque de distinción ${pl('dandy','lo puso','lo pusieron')} ${j('dandy')} 🎩.`]));
    if(aw.win.duro.length)body.push(pick([`🪨 ${j('duro')} ${pl('duro','repartió','repartieron')} más que el cartero.`,`Pierna fuerte y cero miedo: ${j('duro')} 🪨.`]));
    if(aw.win.vaya.length)body.push(pick([`Y mención especial para ${j('vaya')} 🤦: ${pl('vaya','estaba','estaban')} en el campo, pero no se notó.`,`🤦 ${j('vaya')}: hay días que es mejor quedarse en casa.`,`${j('vaya')} 🤦 ${pl('vaya','se lleva','se llevan')} el Vaya día. Habrá revancha.`]));
  }else body.push('Falta la votación del vestuario: los premios están por decidir.');

  return{title,body};
}

  if(med[0])out.push([med[0],med[1]?18:50,24,'Ala']);
  if(med[1])out.push([med[1],82,24,'Ala']);
  if(def[0])out.push([def[0],50,46,'Cierre']);
  if(por[0])out.push([por[0],50,71,'Portero']);
  return out;
}
function totmLines(stM,st){
  const ranked=Object.keys(stM).filter(id=>stM[id].pj>0).sort((a,b)=>stM[b].pts-stM[a].pts||st[b].level-st[a].level);
  const slots=[['DEL',1],['MED',2],['DEF',1],['POR',1]];const used=new Set();const lines=slots.map(()=>[]);
  slots.forEach(([pos,n],i)=>{for(const id of ranked){if(lines[i].length>=n)break;if(!used.has(id)&&(pos==='POR'?(isGK(id)||P(id)?.pos==='POR'):(P(id)?.pos===pos&&!isGK(id)))){lines[i].push(id);used.add(id)}}});
  const rest=ranked.filter(id=>!used.has(id));
  slots.forEach(([,n],i)=>{while(lines[i].length<n&&rest.length){const id=rest.shift();lines[i].push(id);used.add(id)}});
  return lines;
}

function countdownTxt(m){
  const h=hoursTo(m);if(h<=0)return'¡En juego o recién acabado!';
  const d=Math.floor(h/24),hh=Math.floor(h%24),mm=Math.floor((h*60)%60);
  if(h<12&&mdt(m).getDate()===new Date().getDate())return`¡Hoy a las ${m.time}! Faltan ${hh}h ${mm}min`;
  return d?`Faltan ${d} ${d===1?'día':'días'} y ${hh}h`:`Faltan ${hh}h ${mm}min`;
}
function previewHtml(m,T,st){
  if(!T||T.A.length<2||T.B.length<2)return'';
  const lv=p=>st[p]?.level||2;const avg=t=>t.reduce((s,p)=>s+lv(p),0)/t.length;
  const la=avg(T.A),lb=avg(T.B);const eA=1/(1+Math.pow(10,(lb-la)/LV.SCALE));const pa=Math.round(eA*100);
  const star=t=>t.slice().sort((a,b)=>lv(b)-lv(a))[0];
  const hot=t=>t.map(p=>[p,streak(st[p])]).filter(([,s])=>s&&(s.e==='🔥'||s.e==='⚽'));
  const cold=t=>t.map(p=>[p,streak(st[p])]).filter(([,s])=>s&&(s.e==='🥶'||s.e==='🧊'));
  const col=(k,t)=>{const s=star(t),h=hot(t),c=cold(t);return`<div class="pv-col ${TEAM[k].c}">
    <div class="pv-t">${TEAM[k].n}</div><div class="pv-lv">⚡${avg(t).toFixed(2)}</div>
    <div class="pv-k">A seguir</div><div class="pv-p">${face(s)} ${esc(pname(s))}</div>
    ${h.length?`<div class="pv-k">En racha</div>${h.slice(0,2).map(([p,s])=>`<div class="pv-p">${s.e}${s.n} ${esc(pname(p))}</div>`).join('')}`:''}
    ${c.length?`<div class="pv-k">En crisis</div>${c.slice(0,1).map(([p,s])=>`<div class="pv-p">${s.e}${s.n} ${esc(pname(p))}</div>`).join('')}`:''}</div>`};
  const fav=Math.abs(pa-50)<5?'Partido igualadísimo':pa>50?`Favoritos: Blancos`:`Favoritos: Negros`;
  return`<div class="previa"><div class="pv-h"><span>📺 La previa</span><span class="pv-cd">${esc(countdownTxt(m))}</span></div>
    <div class="pv-odds"><div class="pv-bar"><i style="width:${pa}%"></i></div><div class="row small" style="justify-content:space-between;margin-top:6px"><b>Blancos ${pa}%</b><span class="muted">${fav}</span><b>${100-pa}% Negros</b></div></div>
    <div class="pv-grid">${col('A',T.A)}${col('B',T.B)}</div>${wxHtml(m)}</div>`;
}

function wrappedData(pid,y){
  const stS=computeStats(m=>seasonOf(m)===y);const s=stS[pid];if(!s||!s.pj)return null;
  const LVL=computeLevels();const ms=s.hist.map(h=>h.m.id);
  const startLv=ms.length?(LVL[pid].pre[ms[0]]??s.lv0):s.lv0;const endLv=LVL[pid].level;
  const bestM=s.hist.slice().sort((a,b)=>b.pts-a.pts)[0];const goalM=s.hist.slice().sort((a,b)=>b.g-a.g)[0];
  const rank=Object.keys(stS).filter(i=>stS[i].pj>0).sort((a,b)=>stS[b].pts-stS[a].pts);
  const gr=Object.keys(stS).filter(i=>stS[i].pj>0).sort((a,b)=>stS[b].g-stS[a].g);
  return{s,startLv,endLv,bestM,goalM,pos:rank.indexOf(pid)+1,of:rank.length,gpos:gr.indexOf(pid)+1,chem:chemistry(pid),ach:achList().filter(a=>a.t(enrich(computeStats())[pid]))};
}

// crea el partido (con id fijo por regla y fecha, para que nunca se duplique).
const WD=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const recRules=()=>(S.config.recurring?.rules||[]);
function nextOcc(r,from=new Date()){
  const d=new Date(from);d.setHours(0,0,0,0);const occ=new Date(d);occ.setDate(d.getDate()+((r.wd-d.getDay()+7)%7));
  const[hh,mm]=(r.time||'19:00').split(':').map(Number);occ.setHours(hh,mm,0,0);if(occ<=from)occ.setDate(occ.getDate()+7);return occ;
}
function openAt(r,occ){
  const o=new Date(occ);const back=((occ.getDay()-r.openWd+7)%7)||7;o.setDate(occ.getDate()-back);
  const[hh,mm]=(r.openTime||'21:00').split(':').map(Number);o.setHours(hh,mm,0,0);return o;
}
const recId=(r,occ)=>`rec_${r.id}_${ymd(occ)}`;
let recBusy=false;const recDone=new Set();
async function ensureRecurring(){
  if(recBusy||!store||(store.mode==='live'&&!S.conn?.ok))return;
  if(!S.ready.matches||!S.ready.config||!S.ready.players||!me||!P(me)||isPending(me))return;
  if(!['matches','config','players'].every(c=>S.fresh?.[c]))return;
  recBusy=true;
  try{
    for(const r of recRules()){
      if(!r.active)continue;const occ=nextOcc(r),oa=openAt(r,occ);
      if(Date.now()<oa.getTime())continue;
      const id=recId(r,occ);if(recDone.has(id)||S.matches[id]||(S.config.recurring?.skip||[]).includes(id))continue;
      const date=ymd(occ);
      if(findDup(date,r.time,r.venue)){recDone.add(id);continue}
      recDone.add(id);
      await store.doc('matches/'+id).set({date,time:r.time,venue:r.venue,format:r.format||'Fut5',slots:+r.slots||FORMATS[r.format]||10,price:r.price||'',bizum:r.bizum||'',notes:r.notes||'',status:'open',createdBy:r.org||null,createdAt:Date.now(),recurring:r.id},{merge:true});
    }
  }catch(e){console.error(e)}finally{recBusy=false}
}
function recTeasers(){
  return recRules().filter(r=>r.active).map(r=>{const occ=nextOcc(r),oa=openAt(r,occ);return Date.now()<oa.getTime()&&!S.matches[recId(r,occ)]?{r,occ,oa}:null}).filter(Boolean);
}

/* ============ DUELOS ============ */
// Un jugador reta a otro para un partido concreto; el rival acepta o rechaza. Se juegan una caña o la cuota de la pista.
const DUEL_KINDS={goals:{e:'⚽',n:'Más goles',d:'Quién mete más goles en el partido'},win:{e:'🏆',n:'Gana su equipo',d:'Solo vale si os toca en equipos distintos'},stars:{e:'⭐',n:'Mejor nota',d:'Quién saca más estrellas del vestuario'},nutmeg:{e:'🥜',n:'Hacerle un caño',d:'Si se lo haces, ganas. Lo confirma él'}};
const DUEL_STAKES={beer:{e:'🍺',n:'Una caña'},court:{e:'💶',n:'La cuota de la pista'}};
const duelsOf=mid=>Object.values(S.duels).filter(d=>d.mid===mid&&d.status!=='rejected'&&d.status!=='cancelled');
const stakeTxt=d=>{const m=S.matches[d.mid];return d.stake==='court'?`💶 la pista${m?.price?` (${m.price}€)`:''}`:'🍺 una caña'};
function duelResult(d){
  const m=S.matches[d.mid];if(!m)return{state:'void',why:'el partido se borró'};
  const started=m.status==='played'||hoursTo(m)<=0;
  if(d.status==='pending'&&started)return{state:'void',why:'no se aceptó antes del partido'};
  if(d.status!=='accepted')return{state:d.status};
  if(m.status!=='played')return{state:'upcoming'};
  const att=attendees(m);if(!att.includes(d.from)||!att.includes(d.to))return{state:'void',why:'no jugaron los dos'};
  let a,b,final=true;
  if(d.kind==='win'){
    const ra=resultFor(m,d.from),rb=resultFor(m,d.to);const sameTeam=(m.teamA||[]).includes(d.from)===(m.teamA||[]).includes(d.to);
    if(sameTeam)return{state:'void',why:'os tocó en el mismo equipo'};
    if(ra==='E')return{state:'draw'};a=ra==='V'?1:0;b=rb==='V'?1:0;
  }else if(d.kind==='nutmeg'){
    const sameTeam=(m.teamA||[]).includes(d.from)===(m.teamA||[]).includes(d.to);
    if(sameTeam)return{state:'void',why:'os tocó en el mismo equipo'};
    if(d.nut==='yes')return{state:'final',winner:d.from,loser:d.to};
    if(d.nut==='no')return{state:'final',winner:d.to,loser:d.from};
    if(d.nut==='claimed')return{state:'nutclaim'};
    if(duelLocked(m))return{state:'final',winner:d.to,loser:d.from,timeout:true};
    return{state:'nutwait'};
  }else if(d.kind==='goals'){const g=goalsOf(m);a=g[d.from]||0;b=g[d.to]||0;final=true}
  else{const av=matchAwards(m).avg;a=av[d.from]||0;b=av[d.to]||0;final=duelLocked(m)}
  if(a===b)return{state:final?'draw':'live',a,b};
  const w=a>b?d.from:d.to,l=a>b?d.to:d.from;
  return{state:final?'final':'live',winner:w,loser:l,a,b};
}
function duelLine(d){
  const K=DUEL_KINDS[d.kind],r=duelResult(d),m=S.matches[d.mid];
  let st='';
  if(r.state==='pending')st=`<span class="pill">Esperando respuesta</span>`;
  else if(r.state==='upcoming')st=`<span class="pill wht">Aceptado</span>`;
  else if(r.state==='live')st=`<span class="pill">${r.winner?`Va ganando ${esc(pname(r.winner))}`:'Van empatados'} (${d.kind==='stars'?`${(r.a||0).toFixed(1)}–${(r.b||0).toFixed(1)}`:`${r.a}–${r.b}`})</span>`;
  else if(r.state==='final')st=d.settled?`<span class="pill out">✅ Saldado</span>`:`<span class="pill red">${esc(pname(r.loser))} paga</span>`;
  else if(r.state==='draw')st=`<span class="pill">🤝 Empate, nadie paga</span>`;
  else if(r.state==='nutwait')st=`<span class="pill">🥜 ¿Hubo caño? Lo dice ${esc(pname(d.from))}</span>`;
  else if(r.state==='nutclaim')st=`<span class="pill wht">🥜 ${esc(pname(d.from))} dice que se lo hizo</span>`;
  else if(r.state==='void')st=`<span class="pill">Nulo · ${esc(r.why||'')}</span>`;
  let acts='';
  if(d.status==='pending'&&d.to===me&&r.state==='pending')acts=`<button class="btn sm pri" data-act="duelAccept" data-id="${esc(d.id)}">Aceptar</button><button class="btn sm ghost" data-act="duelReject" data-id="${esc(d.id)}">Rechazar</button>`;
  else if((d.status==='pending'||(d.status==='accepted'&&m&&m.status!=='played'&&hoursTo(m)>0))&&d.from===me)acts=`<button class="btn sm ghost" data-act="duelCancel" data-id="${esc(d.id)}">Retirar</button>`;
  if(r.state==='nutwait'&&d.from===me)acts+=`<button class="btn sm pri" data-act="duelNut" data-v="claimed" data-id="${esc(d.id)}">🥜 ¡Se lo hice!</button><button class="btn sm ghost" data-act="duelNut" data-v="no" data-id="${esc(d.id)}">No pude</button>`;
  if(r.state==='nutclaim'&&(d.to===me||isAdmin()||(m&&canManage(m)&&d.from!==me)))acts+=`<button class="btn sm pri" data-act="duelNut" data-v="yes" data-id="${esc(d.id)}">${d.to===me?'Sí, me lo hizo 😩':'Confirmar caño'}</button><button class="btn sm ghost" data-act="duelNut" data-v="no" data-id="${esc(d.id)}">${d.to===me?'¡Mentira!':'No hubo'}</button>`;
  if(r.state==='final'&&!d.settled&&(r.winner===me||isAdmin()))acts+=`<button class="btn sm wht" data-act="duelSettle" data-id="${esc(d.id)}">✅ Me ha pagado</button>`;

function duelRecord(pid){
  let w=0,l=0,owe=0,owed=0;
  Object.values(S.duels).forEach(d=>{if(d.from!==pid&&d.to!==pid)return;const r=duelResult(d);if(r.state!=='final')return;
    if(r.winner===pid){w++;if(!d.settled)owed++}else{l++;if(!d.settled)owe++}});
  return{w,l,owe,owed};
}

/* ============ COPIA DE SEGURIDAD ============ */
async function backup(){
  const cols=['players','matches','signups','stats','votes','voted','galaVotes','galaVoted','config','polls','pollVotes','feedback','duels'];
  const data={};cols.forEach(c=>{data[c]={};Object.values(S[c]||{}).forEach(d=>{const{id,...rest}=d;data[c][id]=rest})});
  const json=JSON.stringify({app:APP_NAME.join(''),exportedAt:new Date().toISOString(),by:me?pname(me):'',data});
  const name=`${APP_NAME.join('').toLowerCase()}-copia-${ymd(new Date())}.json`;
  const blob=new Blob([json],{type:'application/json'});const file=new File([blob],name,{type:'application/json'});
  const kb=Math.round(blob.size/1024);
  const counts=`${Object.keys(data.players).length} jugadores · ${Object.keys(data.matches).length} partidos · ${kb} KB`;
  const url=URL.createObjectURL(blob);
  const can=!!(navigator.canShare&&navigator.canShare({files:[file]}));
  modal(`${mh('Copia de seguridad')}<p class="muted small">${counts}</p>
    ${can?'<button class="btn pri full" id="bsh" style="margin-top:14px">📲 Guardar en Archivos / enviar</button>':''}
    <a class="btn ${can?'':'pri'} full" style="margin-top:10px;text-decoration:none" href="${url}" download="${esc(name)}" id="bdl">⬇️ Descargar archivo</a>
    <p class="small muted" style="margin-top:12px;line-height:1.5">Guárdala en tu iPhone (Archivos) o mándatela a ti mismo. Si algún día se borra algo, con este archivo se puede recuperar todo.</p>`,
  md=>{const mark=async()=>{try{await store.doc('config/app').set({...(S.config.app||{}),lastBackup:Date.now()})}catch(e){}};
    const b=md.querySelector('#bsh');if(b)b.onclick=async()=>{try{await navigator.share({files:[file],title:name});mark();toast('Copia guardada 💾')}catch(e){}};
    md.querySelector('#bdl').addEventListener('click',()=>{mark();setTimeout(()=>toast('Copia descargada 💾'),300)});});
}

// Conexión con Firebase: prueba la base de datos "(default)" y, si no existe, la llamada "default".
// Cada escritura tiene un límite de 12 s para que la app nunca se quede "pillada".
const withTimeout=(p,ms=12000)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout',message:'sin respuesta del servidor'}),ms))]);
async function firebaseStore(cfg){
  const V='10.12.2';
  const app=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const fs=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const fb=app.initializeApp(cfg);
  // Caché en el móvil (IndexedDB): al abrir, la app pinta al instante con lo guardado y luego se sincroniza.
  const mk=(id,cache)=>{const o={ignoreUndefinedProperties:true};if(cache){try{o.localCache=fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})}catch(e){}}
    try{return id==='(default)'?fs.initializeFirestore(fb,o):fs.initializeFirestore(fb,o,id)}catch(e){delete o.localCache;return id==='(default)'?fs.initializeFirestore(fb,o):fs.initializeFirestore(fb,o,id)}};
  const api=fdb=>({mode:'live',app:fb,
    doc:p=>{const r=fs.doc(fdb,p);return{set:(d,o)=>withTimeout(o?fs.setDoc(r,d,o):fs.setDoc(r,d)),update:d=>withTimeout(fs.updateDoc(r,d)),delete:()=>withTimeout(fs.deleteDoc(r))}},
    collection:c=>({onSnapshot:(cb,er)=>{let first=true;return fs.onSnapshot(fs.collection(fdb,c),{includeMetadataChanges:true},s=>{const meta=!first&&s.docChanges().length===0;first=false;
      cb({docs:meta?[]:s.docs.map(d=>({id:d.id,data:()=>d.data()})),fromCache:s.metadata.fromCache,metaOnly:meta})},er)}})});
  if(FIREBASE_DB){
    // Base de datos conocida: sin pruebas previas, se suscribe ya. La comprobación de conexión va en segundo plano.
    const fdb=mk(FIREBASE_DB,true);
    withTimeout(fs.getDocFromServer(fs.doc(fdb,'config','ping')),10000).then(()=>{S.conn={ok:true,code:'',db:FIREBASE_DB}},e=>{S.conn={ok:false,code:e?.code==='permission-denied'?'reglas':(e?.code||'error'),db:FIREBASE_DB}})
      .finally(()=>{scheduleRender();setTimeout(ensureRecurring,300)});
    return api(fdb)}
  const cands=['(default)','default'];
  // Se prueban las dos a la vez y se usa la primera que responda (un "permiso denegado" también indica que existe).
  const probes=cands.map(id=>{const d=mk(id,false);
    return withTimeout(fs.getDocFromServer(fs.doc(d,'config','ping')),10000).then(()=>({d,id,ok:true}),e=>({d,id,ok:false,code:e?.code||'error'}))});
  let fdb=null,diag={ok:false,code:'',db:''};
  const results=await new Promise(res=>{const out=[];probes.forEach(p=>p.then(r=>{out.push(r);if(r.ok||r.code==='permission-denied'||out.length===probes.length)res(out)}))});
  const good=results.find(r=>r.ok)||results.find(r=>r.code==='permission-denied');
  if(good){fdb=good.d;diag={ok:good.ok,code:good.ok?'':'reglas',db:good.id}}
  else{const r=results.find(x=>x.id==='(default)')||results[0];fdb=r.d;diag={ok:false,code:results.map(x=>x.code).join('/'),db:''}}
  S.conn=diag;
  return api(fdb);
}

      update:async d=>{if(!data[c]?.[id])throw new Error('no existe');Object.assign(data[c][id],clean(d));save();emit(c)},
      delete:async()=>{if(data[c])delete data[c][id];save();emit(c)}}},
    collection:c=>({onSnapshot:cb=>{(subs[c]=subs[c]||[]).push(cb);setTimeout(()=>cb(snap(c)),0);return()=>{}}}),

}
